<title>Design Style Swatchbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=Noto+Sans+Myanmar:wght@400;500;600&display=swap">
<style>
/* ─── shell tokens ─────────────────────────────────────────────── */
:root{
  --sans:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --my:"Noto Sans Myanmar","Myanmar Text","Padauk","Pyidaungsu",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --serif:"Instrument Serif",Georgia,"Times New Roman",serif;

  --ground:#E8EAEE;
  --surface:#FCFCFD;
  --surface-2:#F1F3F6;
  --ink:#12141A;
  --ink-2:#565D6A;
  --ink-3:#858C99;
  --rule:#CDD2DA;
  --rule-soft:#DFE3E9;
  --accent:#1B36C8;
  --accent-soft:#E3E7FB;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#101217;
    --surface:#191C22;
    --surface-2:#20242C;
    --ink:#EDEFF4;
    --ink-2:#A0A8B5;
    --ink-3:#79808D;
    --rule:#2B303A;
    --rule-soft:#232830;
    --accent:#93A6FF;
    --accent-soft:#1E2440;
  }
}
:root[data-theme="dark"]{
  --ground:#101217;
  --surface:#191C22;
  --surface-2:#20242C;
  --ink:#EDEFF4;
  --ink-2:#A0A8B5;
  --ink-3:#79808D;
  --rule:#2B303A;
  --rule-soft:#232830;
  --accent:#93A6FF;
  --accent-soft:#1E2440;
}

*{box-sizing:border-box}
body{
  background:var(--ground);
  color:var(--ink);
  font:400 15px/1.6 var(--sans);
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px 96px}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}

/* ─── masthead ─────────────────────────────────────────────────── */
.masthead{padding:56px 0 34px;border-bottom:1px solid var(--rule)}
.kicker{
  font:500 11px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;
  color:var(--accent);margin:0 0 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;
}
.kicker span{color:var(--ink-3)}
h1{
  font:400 clamp(42px,7vw,76px)/0.98 var(--serif);
  letter-spacing:-.015em;margin:0;text-wrap:balance;
}
.lede{
  margin:22px 0 0;max-width:60ch;color:var(--ink-2);font-size:16px;
}
.lede strong{color:var(--ink);font-weight:600}
.anatomy{
  margin-top:30px;display:flex;gap:8px 26px;flex-wrap:wrap;
  font:400 12px/1.5 var(--mono);color:var(--ink-3);
}
.anatomy b{color:var(--ink-2);font-weight:500}

/* ─── section heads ────────────────────────────────────────────── */
section{padding-top:60px}
.sec-head{
  display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;
  padding-bottom:8px;margin-bottom:24px;border-bottom:1px solid var(--rule);
}
.sec-head h2{
  font:400 30px/1.1 var(--serif);margin:0;letter-spacing:-.01em;
}
.sec-head .count{
  font:500 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-3);font-variant-numeric:tabular-nums;
}
.sec-head p{margin:0;color:var(--ink-2);font-size:14px;max-width:52ch;flex:1 1 300px}

/* ─── specimen grid ────────────────────────────────────────────── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:22px}
.card{
  background:var(--surface);border:1px solid var(--rule-soft);
  display:flex;flex-direction:column;overflow:hidden;
  transition:border-color .18s ease, transform .18s ease;
}
.card:hover{border-color:var(--rule);transform:translateY(-2px)}
.meta{padding:15px 16px 17px;display:flex;flex-direction:column;gap:7px;flex:1}
.meta-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.meta h3{font:600 15px/1.2 var(--sans);margin:0;letter-spacing:-.01em}
.era{
  font:400 10px/1 var(--mono);color:var(--ink-3);
  font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:.02em;
}
.desc{margin:0;font-size:13.5px;line-height:1.5;color:var(--ink-2)}
.tell{
  margin:2px 0 0;font:400 11.5px/1.45 var(--mono);color:var(--ink-3);
  padding-top:9px;border-top:1px dashed var(--rule-soft);
}
.tell b{color:var(--accent);font-weight:500;letter-spacing:.08em;text-transform:uppercase;font-size:10px}

/* ─── specimen frame (self-contained colour worlds) ────────────── */
.swatch{
  position:relative;height:176px;overflow:hidden;padding:20px;
  display:flex;align-items:center;justify-content:flex-start;
  border-bottom:1px solid var(--rule-soft);
  background:#ffffff;color:#111111;
}
.mini{position:relative;z-index:3;display:flex;flex-direction:column;align-items:flex-start;gap:7px;width:100%}
.eye{font:500 9px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;opacity:.75}
.ttl{font:600 27px/1 var(--sans);letter-spacing:-.02em}
.sub{font:400 11px/1.4 var(--sans);opacity:.8}
.btn{
  font:500 10px/1 var(--sans);letter-spacing:.05em;text-transform:uppercase;
  padding:8px 14px;margin-top:5px;border:1px solid currentColor;
  background:transparent;color:inherit;display:inline-block;
}
.deco{position:absolute;display:block;z-index:1;pointer-events:none}

/* I. attitudes ------------------------------------------------- */
.sw-trad{background:#F6EFE0;color:#3A2618;justify-content:center;text-align:center}
.sw-trad .mini{align-items:center;gap:9px;padding:14px 10px;border-top:3px double #A9853F;border-bottom:3px double #A9853F}
.sw-trad .eye{color:#A9853F;letter-spacing:.3em}
.sw-trad .ttl{font:400 34px/1 var(--serif);letter-spacing:.01em}
.sw-trad .sub{font-style:italic;font-family:var(--serif);font-size:14px}
.sw-trad .btn{border-color:#A9853F;color:#7A5E2A;letter-spacing:.22em;padding:6px 16px}

.sw-min{background:#FFFFFF;color:#0A0A0A;align-items:flex-start;padding:22px}
.sw-min .mini{gap:0}
.sw-min .eye{opacity:.35;letter-spacing:.24em}
.sw-min .ttl{font-weight:400;font-size:22px;margin-top:58px}
.sw-min .sub{opacity:.4;font-size:10.5px;margin-top:4px}
.sw-min .btn{border:0;padding:0;margin-top:14px;text-transform:none;letter-spacing:0;font-size:10.5px;border-bottom:1px solid #0A0A0A;padding-bottom:2px}

.sw-max{background:#2B0A3D;color:#FFF2B8}
.sw-max .deco.a{inset:0;background:
  radial-gradient(circle at 12% 18%,#FF3D9A 0,transparent 32%),
  radial-gradient(circle at 88% 22%,#00E5B0 0,transparent 30%),
  radial-gradient(circle at 72% 92%,#FFB000 0,transparent 36%),
  repeating-linear-gradient(45deg,rgba(255,255,255,.09) 0 6px,transparent 6px 12px)}
.sw-max .mini{transform:rotate(-3deg)}
.sw-max .ttl{font:400 40px/.9 var(--serif);text-shadow:3px 3px 0 #FF3D9A,6px 6px 0 #00C2FF}
.sw-max .eye{background:#FFB000;color:#2B0A3D;padding:3px 7px}
.sw-max .sub{font-weight:600}
.sw-max .btn{background:#FF3D9A;border-color:#FFF2B8;border-width:2px;color:#fff;font-weight:700}

.sw-brut{background:#FFFFFF;color:#000;font-family:var(--mono)}
.sw-brut .mini{border:3px solid #000;padding:12px;gap:6px}
.sw-brut .eye{font-family:var(--mono);letter-spacing:.05em}
.sw-brut .ttl{font:500 26px/1 var(--mono);letter-spacing:-.03em}
.sw-brut .sub{font-family:var(--mono);color:#0000EE;text-decoration:underline}
.sw-brut .btn{border:3px solid #000;border-radius:0;background:#fff;font-family:var(--mono);text-transform:none;letter-spacing:0}

.sw-mod{background:#E7E4DE;color:#111}
.sw-mod .deco.a{width:46px;height:46px;background:#D93A2B;right:20px;top:20px}
.sw-mod .mini{gap:5px}
.sw-mod .eye{letter-spacing:.2em}
.sw-mod .ttl{font-weight:500;font-size:30px;letter-spacing:-.035em}
.sw-mod .btn{border:0;border-top:2px solid #111;padding:8px 0 0;width:96px;border-radius:0}

/* II. movements ------------------------------------------------ */
.sw-nouv{background:#1D3A2E;color:#EEDDB4;justify-content:center;text-align:center}
.sw-nouv .deco.a{inset:14px;border:1px solid #C4A15A;border-radius:60% 8% 60% 8%/8% 60% 8% 60%}
.sw-nouv .mini{align-items:center;gap:8px}
.sw-nouv .ttl{font:italic 400 34px/1 var(--serif);color:#E7C877}
.sw-nouv .eye{letter-spacing:.34em;color:#C4A15A}
.sw-nouv .btn{border-radius:40% 8% 40% 8%/8% 40% 8% 40%;border-color:#C4A15A;color:#E7C877;padding:7px 18px}

.sw-deco{background:#0C0C0E;color:#E9CE7B;justify-content:center;text-align:center}
.sw-deco .deco.a{left:0;right:0;top:16px;height:22px;background:
  repeating-linear-gradient(90deg,#C9A227 0 2px,transparent 2px 9px);
  -webkit-mask-image:linear-gradient(#000,transparent);mask-image:linear-gradient(#000,transparent)}
.sw-deco .deco.b{left:0;right:0;bottom:16px;height:22px;background:
  repeating-linear-gradient(90deg,#C9A227 0 2px,transparent 2px 9px);
  -webkit-mask-image:linear-gradient(transparent,#000);mask-image:linear-gradient(transparent,#000)}
.sw-deco .mini{align-items:center;gap:9px}
.sw-deco .ttl{font-weight:500;font-size:26px;letter-spacing:.3em;text-transform:uppercase;text-indent:.3em}
.sw-deco .eye{letter-spacing:.4em;text-indent:.4em}
.sw-deco .sub{letter-spacing:.12em;text-transform:uppercase;font-size:9px}
.sw-deco .btn{border-color:#C9A227;letter-spacing:.24em;padding:6px 16px}

.sw-bau{background:#EFEBE2;color:#141414}
.sw-bau .deco.a{width:54px;height:54px;border-radius:50%;background:#1B4FBE;right:-12px;top:16px}
.sw-bau .deco.b{width:0;height:0;border-left:26px solid transparent;border-right:26px solid transparent;border-bottom:44px solid #E4C000;right:34px;bottom:16px}
.sw-bau .deco.c{width:34px;height:34px;background:#D62828;left:-8px;bottom:-8px}
.sw-bau .ttl{font-weight:700;font-size:27px;text-transform:uppercase;letter-spacing:-.01em}
.sw-bau .eye{letter-spacing:.2em}
.sw-bau .btn{background:#141414;color:#EFEBE2;border-color:#141414}

.sw-const{background:#EDE7DD;color:#111;overflow:hidden}
.sw-const .deco.a{width:280px;height:66px;background:#C8102E;left:-40px;top:26px;transform:rotate(-14deg)}
.sw-const .deco.b{width:280px;height:8px;background:#111;left:-40px;top:104px;transform:rotate(-14deg)}
.sw-const .mini{transform:rotate(-14deg);align-items:flex-start;padding-left:6px}
.sw-const .ttl{font:400 34px/.9 "Anton",Impact,var(--sans);text-transform:uppercase;letter-spacing:.01em;color:#FBF7F0}
.sw-const .eye{color:#111;background:#E4C000;padding:3px 6px}
.sw-const .sub{color:#FBF7F0;font-weight:600}
.sw-const .btn{border-color:#111;color:#111;background:#FBF7F0}

.sw-stijl{background:#FAF9F5;color:#111;padding:0}
.sw-stijl .deco.a{left:0;right:0;top:52px;height:7px;background:#111}
.sw-stijl .deco.b{top:0;bottom:0;left:126px;width:7px;background:#111}
.sw-stijl .deco.c{right:0;top:0;width:80px;height:52px;background:#D62828}
.sw-stijl .deco.d{left:0;bottom:0;width:126px;height:46px;background:#1B4FBE}
.sw-stijl .deco.e{right:0;bottom:0;width:52px;height:40px;background:#E4C000}
.sw-stijl .mini{padding:64px 0 0 20px;gap:5px}
.sw-stijl .ttl{font-weight:700;font-size:22px}
.sw-stijl .btn{border-width:2px;padding:5px 10px}

.sw-swiss{background:#FFFFFF;color:#111;align-items:flex-start;padding:20px}
.sw-swiss .deco.a{left:20px;right:20px;top:44px;height:1px;background:#111}
.sw-swiss .mini{gap:0;padding-left:74px}
.sw-swiss .eye{position:absolute;left:-74px;top:4px;color:#D62828;letter-spacing:.1em}
.sw-swiss .ttl{font-weight:500;font-size:25px;letter-spacing:-.04em;margin-top:34px}
.sw-swiss .sub{font-size:10.5px;max-width:22ch;margin-top:6px;line-height:1.35}
.sw-swiss .btn{border:0;padding:0;margin-top:12px;color:#D62828;text-transform:none;letter-spacing:0;font-size:11px}

.sw-mcm{background:#F0E5D0;color:#2C2A24}
.sw-mcm .deco.a{width:96px;height:96px;right:-24px;bottom:-26px;background:#2E6E6B;border-radius:60% 40% 55% 45%/50% 55% 45% 50%}
.sw-mcm .deco.b{width:52px;height:52px;right:56px;top:18px;background:
  conic-gradient(from 0deg,#D8873D 0 8deg,transparent 8deg 45deg,#D8873D 45deg 53deg,transparent 53deg 90deg,
  #D8873D 90deg 98deg,transparent 98deg 135deg,#D8873D 135deg 143deg,transparent 143deg 180deg,
  #D8873D 180deg 188deg,transparent 188deg 225deg,#D8873D 225deg 233deg,transparent 233deg 270deg,
  #D8873D 270deg 278deg,transparent 278deg 315deg,#D8873D 315deg 323deg,transparent 323deg 360deg)}
.sw-mcm .ttl{font-weight:400;font-size:29px;letter-spacing:.01em}
.sw-mcm .eye{color:#B4562A;letter-spacing:.22em}
.sw-mcm .btn{border-radius:20px;border-color:#2E6E6B;color:#2E6E6B;padding:7px 16px}

.sw-pop{background:#FFE500;color:#111}
.sw-pop .deco.a{inset:0;background-image:radial-gradient(#E4002B 1.4px,transparent 1.5px);background-size:8px 8px;opacity:.55}
.sw-pop .mini{gap:6px}
.sw-pop .ttl{font:400 38px/.92 "Anton",Impact,var(--sans);text-transform:uppercase;color:#fff;
  -webkit-text-stroke:2px #111;paint-order:stroke fill;text-shadow:4px 4px 0 #E4002B}
.sw-pop .eye{background:#111;color:#FFE500;padding:3px 7px}
.sw-pop .sub{font-weight:700;font-style:italic}
.sw-pop .btn{background:#E4002B;color:#fff;border:2px solid #111;font-weight:700}

.sw-psy{background:#2A0140;color:#FFF}
.sw-psy .deco.a{inset:-20%;background:conic-gradient(from 20deg,#FF2D95,#FFD400,#00D1B2,#7A2DFF,#FF2D95);filter:blur(22px);opacity:.85}
.sw-psy .mini{align-items:center;text-align:center}
.sw-psy .ttl{font:400 40px/.9 var(--serif);letter-spacing:.04em;transform:skewY(-4deg) scaleY(1.25);
  color:#FFF6C9;text-shadow:0 0 14px #FF2D95,2px 3px 0 #7A2DFF}
.sw-psy .eye{letter-spacing:.34em;color:#2A0140;background:#FFD400;padding:3px 8px;border-radius:12px}
.sw-psy .sub{font-weight:600;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.sw-psy .btn{border-radius:20px;border-width:2px;border-color:#FFD400;color:#FFF6C9}

.sw-mem{background:#F7F3EC;color:#111}
.sw-mem .deco.a{width:70px;height:70px;background:#00C2CE;border-radius:50%;right:-16px;top:-14px;border:3px solid #111}
.sw-mem .deco.b{width:0;height:0;border-left:20px solid transparent;border-right:20px solid transparent;border-bottom:34px solid #FF7BB0;right:74px;bottom:16px;transform:rotate(16deg)}
.sw-mem .deco.c{left:-6px;bottom:14px;width:92px;height:26px;
  background:repeating-linear-gradient(90deg,#F2C230 0 9px,#111 9px 12px)}
.sw-mem .mini{gap:6px}
.sw-mem .ttl{font-weight:700;font-size:28px;color:#111;text-shadow:3px 3px 0 #00C2CE}
.sw-mem .eye{background:#FF7BB0;padding:3px 7px;border:2px solid #111}
.sw-mem .btn{border:2px solid #111;background:#F2C230;border-radius:14px 2px 14px 2px}

.sw-grunge{background:#26221E;color:#DCD4C6}
.sw-grunge .deco.a{inset:0;background:
  radial-gradient(ellipse at 22% 30%,rgba(0,0,0,.6) 0,transparent 45%),
  radial-gradient(ellipse at 78% 74%,rgba(0,0,0,.55) 0,transparent 42%),
  repeating-linear-gradient(102deg,rgba(220,212,198,.05) 0 2px,transparent 2px 5px),
  repeating-linear-gradient(8deg,rgba(0,0,0,.25) 0 1px,transparent 1px 4px)}
.sw-grunge .mini{gap:5px}
.sw-grunge .ttl{font-weight:700;font-size:30px;letter-spacing:-.03em;color:#E8E1D2;
  text-shadow:1px 0 0 #8C1F14,-1px 1px 0 rgba(0,0,0,.8);transform:rotate(-1.5deg)}
.sw-grunge .eye{color:#B4A992;letter-spacing:.24em}
.sw-grunge .sub{color:#A79C86}
.sw-grunge .btn{border-color:#8C1F14;color:#D9A899;
  clip-path:polygon(2% 8%,98% 0,100% 88%,4% 100%,0 40%)}

.sw-y2k{background:linear-gradient(#DCE6F2,#AFC0D6);color:#0B2A5B}
.sw-y2k .deco.a{width:110px;height:110px;border-radius:50%;right:-26px;top:-24px;
  background:radial-gradient(circle at 34% 28%,#FFFFFF,#9FD2FF 40%,#2A6FD6 78%,#0B3E8C);
  box-shadow:0 6px 14px rgba(11,42,91,.35)}
.sw-y2k .ttl{font-weight:700;font-size:30px;letter-spacing:-.02em;
  background:linear-gradient(#FFFFFF,#B9C6D6 44%,#5E7591 52%,#E8EEF6);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 1px 0 rgba(255,255,255,.9)) drop-shadow(0 2px 3px rgba(11,42,91,.5))}
.sw-y2k .eye{color:#2A6FD6}
.sw-y2k .btn{border-radius:20px;border-color:#8FB0D8;color:#0B2A5B;
  background:linear-gradient(#FFFFFF,#C8D8EC);box-shadow:0 2px 5px rgba(11,42,91,.28),inset 0 1px 0 #fff}

.sw-vapor{background:linear-gradient(#1B0538 0%,#4A1063 46%,#B4257E 66%,#FF6BAA 100%);color:#F7E6FF;overflow:hidden}
.sw-vapor .deco.a{left:-40%;right:-40%;bottom:0;height:74px;
  background:repeating-linear-gradient(90deg,rgba(0,246,255,.75) 0 1px,transparent 1px 26px),
             repeating-linear-gradient(0deg,rgba(0,246,255,.75) 0 1px,transparent 1px 13px);
  transform:perspective(90px) rotateX(58deg);transform-origin:bottom}
.sw-vapor .deco.b{width:74px;height:74px;border-radius:50%;right:22px;top:14px;
  background:linear-gradient(#FFE47A,#FF5FA2);opacity:.9}
.sw-vapor .ttl{font-weight:700;font-size:28px;letter-spacing:.16em;text-transform:uppercase;
  color:#FFFFFF;text-shadow:2px 0 0 #00F6FF,-2px 0 0 #FF2D95}
.sw-vapor .eye{letter-spacing:.4em;color:#00F6FF}
.sw-vapor .btn{border-color:#00F6FF;color:#00F6FF;background:rgba(27,5,56,.5)}

/* III. digital -------------------------------------------------- */
.sw-skeu{background:
  repeating-linear-gradient(45deg,rgba(0,0,0,.045) 0 2px,transparent 2px 4px),
  linear-gradient(#5E4B36,#4A3A28);color:#F3E9D8}
.sw-skeu .mini{background:linear-gradient(#FBF6EA,#E7DCC6);border:1px solid #9C8664;
  border-radius:7px;padding:13px;color:#3A2E1E;gap:6px;
  box-shadow:0 3px 6px rgba(0,0,0,.45),inset 0 1px 0 #fff}
.sw-skeu .ttl{font-weight:700;font-size:23px;color:#3A2E1E;text-shadow:0 1px 0 rgba(255,255,255,.85)}
.sw-skeu .eye{color:#7A6647}
.sw-skeu .btn{border:1px solid #2C5B96;border-radius:5px;color:#fff;
  background:linear-gradient(#7DB2EC,#3574C2 50%,#2A64AE 51%,#1F4F92);
  box-shadow:0 2px 3px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.55);
  text-shadow:0 -1px 0 rgba(0,0,0,.4)}

.sw-flat{background:#2D9CDB;color:#FFFFFF}
.sw-flat .deco.a{width:64px;height:64px;background:#F2C94C;right:18px;bottom:18px}
.sw-flat .ttl{font-weight:600;font-size:28px}
.sw-flat .btn{background:#EB5757;border:0;color:#fff;padding:10px 16px;border-radius:0}

.sw-mat{background:#F5F3F7;color:#1D1B20}
.sw-mat .mini{background:#FFFFFF;border-radius:12px;padding:14px;gap:6px;
  box-shadow:0 1px 2px rgba(0,0,0,.14),0 4px 10px rgba(0,0,0,.10)}
.sw-mat .deco.a{width:44px;height:44px;border-radius:50%;background:#6750A4;right:18px;bottom:16px;
  box-shadow:0 4px 10px rgba(103,80,164,.45);z-index:4}
.sw-mat .deco.a::after{content:"+";position:absolute;inset:0;display:grid;place-items:center;
  color:#fff;font:400 22px/1 var(--sans)}
.sw-mat .eye{color:#6750A4;letter-spacing:.14em}
.sw-mat .ttl{font-weight:500;font-size:24px}
.sw-mat .btn{background:#6750A4;border:0;color:#fff;border-radius:20px;padding:9px 18px}

.sw-neu{background:#E4E8EF;color:#4A5265}

/* ─── chronology rail ──────────────────────────────────────────── */
.rail-wrap{overflow-x:auto;padding-bottom:6px;margin-bottom:26px}
.rail{
  display:flex;gap:0;min-width:760px;position:relative;padding:16px 0 4px;
  border-bottom:1px solid var(--rule);
}
.rail li{list-style:none;flex:1;position:relative;padding:0 0 16px}
.rail li::after{
  content:"";position:absolute;left:0;bottom:-4px;width:7px;height:7px;border-radius:50%;
  background:var(--accent);
}
.rail .yr{display:block;font:500 12px/1 var(--mono);color:var(--ink);font-variant-numeric:tabular-nums}
.rail .nm{display:block;font-size:11.5px;color:var(--ink-2);margin-top:4px;padding-right:8px}

/* ─── method / vocabulary lists ────────────────────────────────── */
.defs{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:0 44px}
.defs div{
  display:grid;grid-template-columns:minmax(0,150px) 1fr;gap:16px;
  padding:13px 0;border-top:1px solid var(--rule-soft);align-items:baseline;
}
.defs dt{font:600 13px/1.4 var(--sans);color:var(--ink);margin:0}
.defs dd{margin:0;font-size:13.5px;line-height:1.5;color:var(--ink-2)}

.vocab{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:2px 26px}
.vocab div{padding:10px 0;border-top:1px solid var(--rule-soft)}
.vocab b{display:block;font:500 12px/1.4 var(--mono);letter-spacing:.02em;color:var(--ink)}
.vocab span{display:block;font-size:12.5px;line-height:1.45;color:var(--ink-3);margin-top:2px}

.closer{
  margin-top:64px;padding:26px 0 0;border-top:2px solid var(--ink);
  display:flex;gap:26px;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;
}
.closer p{margin:0;max-width:56ch;color:var(--ink-2);font-size:14px}
.closer p b{color:var(--ink);font-weight:600}
.closer .sig{font:400 12px/1.6 var(--mono);color:var(--ink-3);text-align:right}

  .masthead{padding:38px 0 26px}

  .defs div{grid-template-columns:1fr;gap:4px}
}

  *{transition:none !important;animation:none !important}
  .card:hover{transform:none}

.hint{font:400 11px/1.5 var(--mono);color:var(--ink-3)}

button.card{

}

var lang = "my";
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;"); }
function myc(){ return lang === "my" ? " my" : ""; }
function mycls(){ return lang === "my" ? "my" : ""; }

function swatchHTML(s){
  var h = '<div class="swatch sw-' + s.c + '">';
  for (var i = 0; i < s.d.length; i++){ h += '<i class="deco ' + s.d[i] + '"></i>'; }
  h += '<div class="mini">';
  if (!s.noEye){ h += '<span class="eye">' + esc(s.eye) + '</span>'; }
  h += '<span class="ttl">Studio</span>';
  h += '<span class="sub">' + esc(s.sub || "Design & Print") + '</span>';
  h += '<span class="btn">' + esc(s.btn || "View") + '</span>';
  return h + '</div></div>';
}

function cardHTML(s, i){
  return '<button type="button" class="card" data-i="' + i + '">' +
    swatchHTML(s) +
    '<div class="meta">' +
      '<div class="meta-top"><h3 class="' + mycls() + '">' +
        esc(lang === "my" ? s.mn : s.n) + '</h3><span class="era">' + esc(s.era) + '</span></div>' +
      '<p class="desc' + myc() + '">' + esc(lang === "my" ? s.m : s.e) + '</p>' +
      '<span class="open-cue' + myc() + '">' + esc(UI[lang].open) + '</span>' +
    '</div></button>';
}

function railHTML(){
  var h = '<div class="rail-wrap"><ol class="rail">';
  for (var i = 0; i < RAIL.length; i++){
    h += '<li><span class="yr">' + RAIL[i].y + '</span><span class="nm' + myc() + '">' +
         esc(lang === "my" ? RAIL[i].m : RAIL[i].e) + '</span></li>';
  }
  return h + '</ol></div>';
}

function render(){
  var t = UI[lang];
  document.documentElement.setAttribute("lang", lang === "my" ? "my" : "en");
  $("btn-en").setAttribute("aria-pressed", lang === "en" ? "true" : "false");
  $("btn-my").setAttribute("aria-pressed", lang === "my" ? "true" : "false");

  $("kicker").innerHTML = esc(t.kick) + ' <span>' + esc(t.kick2) + '</span>';
  $("kicker").className = "kicker" + myc();
  $("pgtitle").textContent = t.title;
  $("pgtitle").className = mycls();
  $("lede").innerHTML = t.lede;
  $("lede").className = "lede" + myc();
  $("hint").textContent = t.hint;
  $("hint").className = "hint" + myc();
  $("anatomy").innerHTML = t.anat.map(function(a){ return "<span>" + a + "</span>"; }).join("");
  $("anatomy").className = "anatomy" + myc();

  var out = "";
  for (var g = 0; g < GROUPS.length; g++){
    var grp = GROUPS[g];
    var items = [];
    for (var q = 0; q < STYLES.length; q++){ if (STYLES[q].g === g){ items.push(q); } }
    out += '<section><div class="sec-head"><h2 class="' + mycls() + '">' +
           esc(lang === "my" ? grp.m : grp.e) + '</h2><span class="count">' +
           ("0" + items.length).slice(-2) + '</span><p class="' + mycls() + '">' +
           esc(lang === "my" ? grp.pm : grp.pe) + '</p></div>';
    if (g === 2){ out += railHTML(); }
    out += '<div class="grid">';
    for (var i = 0; i < items.length; i++){ out += cardHTML(STYLES[items[i]], items[i]); }
    out += '</div></section>';
  }

  out += '<section><div class="sec-head"><h2 class="' + mycls() + '">' +
         esc(t.method) + '</h2><span class="count">10</span><p class="' + mycls() +
         '">' + esc(t.methodP) + '</p></div><dl class="defs">';
  for (var k = 0; k < METHOD.length; k++){
    var r = METHOD[k];
    out += '<div><dt class="' + mycls() + '">' + esc(lang === "my" ? r[1] : r[0]) +
           '</dt><dd class="' + mycls() + '">' + esc(lang === "my" ? r[3] : r[2]) + '</dd></div>';
  }
  out += '</dl></section>';

  out += '<section><div class="sec-head"><h2 class="' + mycls() + '">' +
         esc(t.vocabH) + '</h2><span class="count">12</span><p class="' + mycls() +
         '">' + esc(t.vocabP) + '</p></div><div class="vocab">';
  for (var v = 0; v < VOCAB.length; v++){
    var w = VOCAB[v];
    out += '<div><b>' + esc(w[0]) +
           (lang === "my" ? ' <span class="my">' + esc(w[1]) + '</span>' : '') +
           '</b><span class="' + mycls() + '">' + esc(lang === "my" ? w[3] : w[2]) + '</span></div>';
  }
  out += '</div></section>';

  $("sections").innerHTML = out;
  $("closer").innerHTML = '<p class="' + mycls() + '">' + t.closer +
                          '</p><p class="sig">' + t.sig + '</p>';
}

var lastFocus = null;
function openSheet(i){
  var s = STYLES[i], t = UI[lang], first = (lang === "my");
  lastFocus = document.activeElement;
  $("sheet-swatch").innerHTML = swatchHTML(s);
  function blk(label, my, en){
    return '<div class="blk"><span class="lbl' + myc() + '">' + esc(label) + '</span>' +
      (first ? '<p class="my">' + esc(my) + '</p><p class="en">' + esc(en) + '</p>'
             : '<p>' + esc(en) + '</p><p class="my en">' + esc(my) + '</p>') + '</div>';
  }
  var body = '<div class="sheet-head"><div><h3 id="sheet-title">' + esc(s.n) +
    '</h3><span class="my-name">' + esc(s.mn) + '</span></div><span class="era">' +
    esc(s.era) + '</span></div>';
  body += blk(t.lblWhat, s.m, s.e);
  body += blk(t.lblTell, s.tm, s.te);
  body += blk(t.lblWhere, s.wm, s.we);
  body += '<button type="button" class="sheet-close' + myc() + '" id="sheet-close">' + esc(t.close) + '</button>';
  $("sheet-body").innerHTML = body;
  $("ov").hidden = false;
  document.body.style.overflow = "hidden";
  $("sheet-close").focus();
}

function closeSheet(){
  $("ov").hidden = true;
  document.body.style.overflow = "";
  if (lastFocus){ lastFocus.focus(); }
}

$("btn-en").addEventListener("click", function(){ lang = "en"; render(); });
$("btn-my").addEventListener("click", function(){ lang = "my"; render(); });
$("sections").addEventListener("click", function(ev){
  var c = ev.target.closest ? ev.target.closest(".card") : null;
  if (c){ openSheet(parseInt(c.getAttribute("data-i"), 10)); }
});
$("ov").addEventListener("click", function(ev){
  if (ev.target === $("ov") || ev.target.id === "sheet-close"){ closeSheet(); }
});
document.addEventListener("keydown", function(ev){
  if (ev.key === "Escape" && !$("ov").hidden){ closeSheet(); }
});

render();
</script>
